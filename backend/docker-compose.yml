version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: slashforge-postgres
    environment:
      POSTGRES_DB: slashforge
      POSTGRES_USER: slashforge_user
      POSTGRES_PASSWORD: slashforge_dev_password
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: 
      - "postgres"
      - "-c"
      - "password_encryption=md5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slashforge_user -d slashforge"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
